# The 13 split locations from the historical launcher, evaluated under the NEW shared design.
# This is a prospective comparison template, not a reproduction of old model/protocol settings.
# Codec boundary normalization follows the activation boundary: embedding uses post,
# raw residual streams use none, and the backbone's final norm uses both. Internal
# residual-block LayerNorm remains part of the shared codec. FiLM stays off.
# Decoder receiver layers use a second memory codec; count both streams and their parameters.
name: splits
task_configs: [../tasks/coco.yaml, ../tasks/hellaswag.yaml]
seeds: [0]
experiments:
  - name: enc_emb
    model_overrides:
      split: {stack: enc, where: after_embed}
      codec: {layernorm: post}
  - name: enc_l4
    model_overrides:
      split: {stack: enc, where: after_layer, index: 4}
      codec: {layernorm: none}
  - name: enc_l9
    model_overrides:
      split: {stack: enc, where: after_layer, index: 9}
      codec: {layernorm: none}
  - name: enc_l14
    model_overrides:
      split: {stack: enc, where: after_layer, index: 14}
      codec: {layernorm: none}
  - name: enc_l19
    model_overrides:
      split: {stack: enc, where: after_layer, index: 19}
      codec: {layernorm: none}
  - name: enc_fn
    model_overrides:
      split: {stack: enc, where: after_final_norm}
      codec: {layernorm: both}
  - name: dec_l0
    model_overrides:
      split: {stack: dec, where: after_layer, index: 0}
      codec: {layernorm: none}
  - name: dec_l4
    model_overrides:
      split: {stack: dec, where: after_layer, index: 4}
      codec: {layernorm: none}
  - name: dec_l8
    model_overrides:
      split: {stack: dec, where: after_layer, index: 8}
      codec: {layernorm: none}
  - name: dec_l12
    model_overrides:
      split: {stack: dec, where: after_layer, index: 12}
      codec: {layernorm: none}
  - name: dec_l16
    model_overrides:
      split: {stack: dec, where: after_layer, index: 16}
      codec: {layernorm: none}
  - name: dec_l20
    model_overrides:
      split: {stack: dec, where: after_layer, index: 20}
      codec: {layernorm: none}
  - name: dec_l24
    model_overrides:
      split: {stack: dec, where: after_layer, index: 24}
      codec: {layernorm: none}
