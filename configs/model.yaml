# Shared enc_l9 design adopted from the completed September recipes.
# Historical checkpoints retain their saved model design.
model:
  name: google/t5gemma-2-1b-1b
  revision: dd0a2683227859151b1730ca3a63087df5b5f39b
  device: cuda
  dtype: bfloat16
split:
  stack: enc
  where: after_layer
  index: 9
codec:
  hidden_dim: 1152
  bottleneck_dim: 512
  n_res_blocks: 2
  activation: gelu
  dropout: 0.0
  layernorm: none
  memory:
    layernorm: both
  snr_film: false
  film_hidden: 64
channel:
  type: awgn
  kwargs: {}
  normalize_power: true
  train_noise: true
  train_snr_range:
  - -6.0
  - 18.0
  clean_film_snr: 18.0
