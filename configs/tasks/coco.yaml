# Paths are relative to this file. A step = one optimizer update.
model_config: ../model.yaml
task: coco
seed: 0
run:
  name: coco
  output_dir: ../../runs
  wandb_project: null
data:
  name: lmms-lab/COCO-Caption
  revision: c3213b54e173ae86517d481de17f31439d6f8c72
  karpathy_name: yerevann/coco-karpathy
  karpathy_revision: 448fdb1bc7b2d09e46881c4541a14d796a3d41e8
  num_train: 10000
  num_validation: 512
  num_report: 2000
  num_demos: 4
  max_prompt_length: 1500
  max_target_length: 64
  num_workers: 4
training:
  max_steps: 6000                # 12,000 microbatches with accumulation=2.
  batch_size: 16
  gradient_accumulation: 2
  lr: 0.0002
  weight_decay: 0.01
  warmup_ratio: 0.05
  min_lr_ratio: 0.1
  grad_clip: 1.0
  temperature: 1.0
  kl_weight: 1.0
  mse_weight: 0.1
  eval_every: 1000
  validation_snrs: [0, 6, 12]
  validation_batches: null       # All validation batches.
  monitor: kl
  patience: null                 # Fixed budget; set an integer for early stopping.
  min_steps: 0
  min_delta: 0.005
  log_every: 50
  save_steps: [2000, 4000, 6000]
evaluation:
  snrs: [no_noise, -6, -3, 0, 3, 6, 9, 12, 15, 18]
  batch_size: 8
  num_samples: 2000
  max_new_tokens: 64
  vanilla: true
