# Current default: completed September recipe, with portable output location.
# Execution is separate from configuration adoption; see docs/current-defaults.md.
model_config: ../model.yaml
task: coco
seed: 0
run:
  name: coco-enc_l9
  output_dir: ../../runs
  wandb_project: null
data:
  name: lmms-lab/COCO-Caption
  revision: c3213b54e173ae86517d481de17f31439d6f8c72
  karpathy_name: yerevann/coco-karpathy
  karpathy_revision: 448fdb1bc7b2d09e46881c4541a14d796a3d41e8
  num_train: 10000
  num_validation: 512
  num_report: 2000
  num_demos: 4
  max_prompt_length: 1500
  max_target_length: 64
  num_workers: 4
training:
  record_coco_presentations: true
  max_steps: 500
  batch_size: 16
  gradient_accumulation: 4
  lr: 0.0002
  weight_decay: 0.01
  warmup_ratio: 0.05
  min_lr_ratio: 0.1
  grad_clip: 1.0
  temperature: 1.0
  kl_weight: 1.0
  mse_weight: 0.1
  eval_every: 500
  validation_snrs:
  - 0
  - 6
  - 12
  validation_batches: null
  monitor: kl
  patience: null
  min_steps: 0
  min_delta: 0.005
  log_every: 50
  save_steps:
  - 500
  schedule_steps: 500
  selection_steps:
  - 500
  streamed_backward: true
  valid_only_kl: true
evaluation:
  snrs:
  - no_noise
  - -6
  - 6
  - 18
  batch_size: 16
  num_samples: 2000
  max_new_tokens: 64
  vanilla: false
  mode: codec_only
runtime:
  sdpa_backend_policy: flash_math
