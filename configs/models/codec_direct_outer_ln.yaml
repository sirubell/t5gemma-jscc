# Explicit enc_fn direct-plus-outer-LayerNorm design; preparing this design launches no runs.
model:
  name: google/t5gemma-2-1b-1b
  revision: dd0a2683227859151b1730ca3a63087df5b5f39b
  device: cuda
  dtype: bfloat16
split:
  stack: enc
  where: after_final_norm
codec:
  architecture: direct_outer_ln
  # hidden_dim and activation are retained metadata; direct affine does not use them.
  hidden_dim: 1152
  bottleneck_dim: 512
  n_res_blocks: 0
  activation: gelu
  dropout: 0.0
  layernorm: both
  memory:
    layernorm: both
  snr_film: false
  film_hidden: 64
channel:
  type: awgn
  kwargs: {}
  normalize_power: true
  train_noise: true
  train_snr_range:
  - -6.0
  - 18.0
  clean_film_snr: 18.0
